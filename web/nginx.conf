server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The console is a hash-router SPA, so index.html serves every route.
  location / {
    try_files $uri /index.html;
  }

  # Proxy the API so the browser sees one origin and CORS never applies.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location ~* \.(json|js|css|woff2)$ {
    expires 1h;
    add_header Cache-Control "public";
  }
}
